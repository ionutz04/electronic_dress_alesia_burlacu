<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="20" y="26" font-size="17" font-weight="bold" fill="#222">electronic_dress_alesia: wiring</text>

  <!-- Rails -->
  <g stroke-width="3" fill="none">
    <path d="M80 50 H1040" stroke="#d32f2f"/>
    <path d="M80 600 H1040" stroke="#333"/>
  </g>
  <text x="1046" y="55" fill="#d32f2f" font-weight="bold">+5V</text>
  <text x="1046" y="605" fill="#333" font-weight="bold">GND</text>

  <!-- 5 V supply -->
  <rect x="20" y="270" width="120" height="100" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="80" y="312" text-anchor="middle" font-weight="bold" fill="#222">5 V supply</text>
  <text x="80" y="332" text-anchor="middle" font-size="11" fill="#555">USB / power bank</text>
  <text x="88" y="288" fill="#d32f2f" font-weight="bold">+</text>
  <text x="88" y="364" fill="#333" font-weight="bold">−</text>
  <path d="M80 270 V50" stroke="#d32f2f" stroke-width="2.5" fill="none"/>
  <path d="M80 370 V600" stroke="#333" stroke-width="2.5" fill="none"/>

  <!-- ESP32-C3 SuperMini -->
  <rect x="200" y="200" width="160" height="240" rx="8" fill="#e8f0fe" stroke="#1a3d7c" stroke-width="2"/>
  <text x="280" y="305" text-anchor="middle" font-weight="bold" fill="#1a3d7c">ESP32-C3</text>
  <text x="280" y="324" text-anchor="middle" font-weight="bold" fill="#1a3d7c">SuperMini</text>
  <text x="210" y="234" fill="#222">5V</text>
  <text x="210" y="414" fill="#222">GND</text>
  <text x="350" y="254" text-anchor="end" fill="#222">GPIO2</text>
  <text x="350" y="394" text-anchor="end" fill="#222">GPIO3</text>
  <path d="M200 230 H170 V50" stroke="#d32f2f" stroke-width="2.5" fill="none"/>
  <path d="M200 410 H170 V600" stroke="#333" stroke-width="2.5" fill="none"/>

  <!-- WS2812B strip -->
  <text x="580" y="92" text-anchor="middle" font-weight="bold" fill="#222">WS2812B strip (6 LEDs)</text>
  <rect x="440" y="100" width="280" height="80" rx="6" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <g fill="#e040fb" stroke="#7b1fa2" stroke-width="1.5">
    <rect x="480" y="126" width="28" height="28" rx="4"/>
    <rect x="518" y="126" width="28" height="28" rx="4"/>
    <rect x="556" y="126" width="28" height="28" rx="4"/>
    <rect x="594" y="126" width="28" height="28" rx="4"/>
    <rect x="632" y="126" width="28" height="28" rx="4"/>
    <rect x="670" y="126" width="28" height="28" rx="4"/>
  </g>
  <g font-size="11" fill="#222">
    <text x="446" y="119">5V</text>
    <text x="446" y="144">DIN</text>
    <text x="446" y="169">GND</text>
  </g>
  <path d="M440 115 H420 V50" stroke="#d32f2f" stroke-width="2.5" fill="none"/>
  <path d="M440 165 H410 V600" stroke="#333" stroke-width="2.5" fill="none"/>

  <!-- GPIO2 -> 330R -> DIN -->
  <path d="M360 250 H390 V220 M390 170 V140 H440" stroke="#1565c0" stroke-width="2.5" fill="none"/>
  <rect x="382" y="170" width="16" height="50" fill="#fff" stroke="#1565c0" stroke-width="2"/>
  <text x="404" y="212" font-size="12" fill="#1565c0">330 Ω</text>

  <!-- Plain LED bank: 5 branches -->
  <text x="1040" y="36" text-anchor="end" font-size="12" fill="#555">R1–R5 = 150 Ω (red/yellow) · 100 Ω (blue/white/green)</text>
  <g id="branch">
    <path d="M780 50 V90 M780 140 V180 M780 200 V300" stroke="#d32f2f" stroke-width="2" fill="none"/>
    <rect x="772" y="90" width="16" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
    <polygon points="768,180 792,180 780,200" fill="#ffeb3b" stroke="#333" stroke-width="2"/>
    <path d="M768 200 H792" stroke="#333" stroke-width="2.5"/>
    <path d="M794 184 l10 -6 M794 194 l10 -6" stroke="#f9a825" stroke-width="1.8"/>
  </g>
  <use href="#branch" x="60"/>
  <use href="#branch" x="120"/>
  <use href="#branch" x="180"/>
  <use href="#branch" x="240"/>
  <g font-size="11" fill="#222">
    <text x="766" y="195" text-anchor="end">D1</text>
    <text x="826" y="195" text-anchor="end">D2</text>
    <text x="886" y="195" text-anchor="end">D3</text>
    <text x="946" y="195" text-anchor="end">D4</text>
    <text x="1006" y="195" text-anchor="end">D5</text>
  </g>

  <!-- Collector bus -->
  <path d="M780 300 H1020" stroke="#333" stroke-width="2.5" fill="none"/>

  <!-- NPN transistor -->
  <circle cx="893" cy="390" r="28" fill="#fff" stroke="#333" stroke-width="2"/>
  <path d="M885 370 V410" stroke="#333" stroke-width="3"/>
  <path d="M885 380 L900 366 V300" stroke="#333" stroke-width="2.5" fill="none"/>
  <path d="M885 400 L900 414 V600" stroke="#333" stroke-width="2.5" fill="none"/>
  <polygon points="901,415 889,412 897,404" fill="#333"/>
  <text x="930" y="384" font-weight="bold" fill="#222">Q1 NPN</text>
  <text x="930" y="401" font-size="11" fill="#555">2N2222 / BC337 / S8050</text>
  <text x="868" y="368" font-size="10" fill="#555">B</text>
  <text x="906" y="350" font-size="10" fill="#555">C</text>
  <text x="906" y="440" font-size="10" fill="#555">E</text>

  <!-- GPIO3 -> 1k -> base (hops over the strip GND wire) -->
  <path d="M360 390 H402 A8 8 0 0 1 418 390 H600 M660 390 H885" stroke="#1565c0" stroke-width="2.5" fill="none"/>
  <rect x="600" y="382" width="60" height="16" fill="#fff" stroke="#1565c0" stroke-width="2"/>
  <text x="630" y="374" text-anchor="middle" font-size="12" fill="#1565c0">1 kΩ</text>

  <!-- Junction dots -->
  <g fill="#222">
    <circle cx="170" cy="50" r="4.5"/><circle cx="420" cy="50" r="4.5"/>
    <circle cx="780" cy="50" r="4.5"/><circle cx="840" cy="50" r="4.5"/><circle cx="900" cy="50" r="4.5"/>
    <circle cx="960" cy="50" r="4.5"/><circle cx="1020" cy="50" r="4.5"/>
    <circle cx="170" cy="600" r="4.5"/><circle cx="410" cy="600" r="4.5"/><circle cx="900" cy="600" r="4.5"/>
    <circle cx="840" cy="300" r="4.5"/><circle cx="900" cy="300" r="4.5"/><circle cx="960" cy="300" r="4.5"/>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#222">
    <path d="M440 520 h30" stroke="#d32f2f" stroke-width="3"/><text x="478" y="524">+5 V</text>
    <path d="M530 520 h30" stroke="#333" stroke-width="3"/><text x="568" y="524">GND (common to everything)</text>
    <path d="M760 520 h30" stroke="#1565c0" stroke-width="3"/><text x="798" y="524">3.3 V logic signal</text>
    <text x="440" y="550" fill="#555">Dot = connection. A wire that hops over another is not connected to it.</text>
  </g>
</svg>
